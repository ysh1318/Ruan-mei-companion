name: Build Ruan Mei APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.ruanmei --project-name ruan_mei_companion fresh_project
          echo "✓ Fresh Flutter project created"

      - name: Extract our source code from zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip "$ZIP" -d extracted/
          PROJECT=$(dirname $(find extracted/ -name "pubspec.yaml" | head -1))
          echo "Project root: $PROJECT"

          # Copy our lib/ assets/ pubspec.yaml into fresh project
          cp -r "$PROJECT/lib/." fresh_project/lib/
          cp -r "$PROJECT/assets/." fresh_project/assets/ 2>/dev/null || true
          cp "$PROJECT/pubspec.yaml" fresh_project/pubspec.yaml

          echo "✓ Source code injected"
          ls fresh_project/lib/

      - name: Fix pubspec assets section
        working-directory: fresh_project
        run: |
          # Make sure assets folder exists
          mkdir -p assets/live2d/html

          # Copy html viewer
          find ../extracted -name "live2d_viewer.html" -exec cp {} assets/live2d/html/ \;

          echo "✓ Assets ready"
          ls assets/live2d/html/

      - name: Flutter pub get
        working-directory: fresh_project
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        working-directory: fresh_project
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: RuanMei-Companion-APK
          path: fresh_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
