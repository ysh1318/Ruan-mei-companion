name: Build Ruan Mei APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip "$ZIP" -d extracted/
          # Find the folder containing pubspec.yaml
          PROJECT=$(dirname $(find extracted/ -name "pubspec.yaml" | head -1))
          echo "Project root: $PROJECT"
          # Move everything to workspace root
          cp -r "$PROJECT"/. .
          echo "✓ Extracted successfully"
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/RuanMei-Companion.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuanMei-Companion-APK
          path: build/app/outputs/flutter-apk/RuanMei-Companion.apk
          retention-days: 30
          
