name: Build Ruan Mei APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Create fresh Flutter project
        run: flutter create --org com.ruanmei --project-name ruan_mei_companion fresh_project

      - name: Extract source from zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip "$ZIP" -d extracted/
          PROJECT=$(dirname $(find extracted/ -name "pubspec.yaml" | head -1))
          cp -r "$PROJECT/lib/." fresh_project/lib/
          mkdir -p fresh_project/assets/live2d/html
          find extracted/ -name "live2d_viewer.html" -exec cp {} fresh_project/assets/live2d/html/ \;

      - name: Write all project files
        run: |
          printf '%s\n' \
            "name: ruan_mei_companion" \
            "description: Ruan Mei Live2D Companion" \
            "publish_to: 'none'" \
            "version: 1.0.0+1" \
            "" \
            "environment:" \
            "  sdk: '>=3.5.0 <4.0.0'" \
            "" \
            "dependencies:" \
            "  flutter:" \
            "    sdk: flutter" \
            "  flutter_overlay_window: ^0.4.0" \
            "  flutter_inappwebview: ^6.1.0" \
            "  record: ^6.0.0" \
            "  just_audio: ^0.9.40" \
            "  http: ^1.2.0" \
            "  permission_handler: ^12.0.0" \
            "  shared_preferences: ^2.3.0" \
            "  provider: ^6.1.2" \
            "  file_picker: ^8.1.2" \
            "  path_provider: ^2.1.4" \
            "  path: ^1.9.0" \
            "  flutter_keyboard_visibility: ^6.0.0" \
            "  cupertino_icons: ^1.0.8" \
            "  google_fonts: ^6.2.1" \
            "" \
            "dev_dependencies:" \
            "  flutter_test:" \
            "    sdk: flutter" \
            "  flutter_lints: ^5.0.0" \
            "" \
            "flutter:" \
            "  uses-material-design: true" \
            "  assets:" \
            "    - assets/live2d/" \
            "    - assets/live2d/html/" \
            > fresh_project/pubspec.yaml

          printf '%s\n' \
            "distributionBase=GRADLE_USER_HOME" \
            "distributionPath=wrapper/dists" \
            "zipStoreBase=GRADLE_USER_HOME" \
            "zipStorePath=wrapper/dists" \
            "distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip" \
            > fresh_project/android/gradle/wrapper/gradle-wrapper.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '    id "kotlin-android"' \
            '    id "dev.flutter.flutter-gradle-plugin"' \
            '}' \
            'android {' \
            '    namespace "com.ruanmei.ruan_mei_companion"' \
            '    compileSdk 36' \
            '    ndkVersion "27.0.12077973"' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions { jvmTarget = "17" }' \
            '    defaultConfig {' \
            '        applicationId "com.ruanmei.ruan_mei_companion"' \
            '        minSdk 24' \
            '        targetSdk 36' \
            '        versionCode 1' \
            '        versionName "1.0.0"' \
            '    }' \
            '    buildTypes {' \
            '        release {' \
            '            signingConfig signingConfigs.debug' \
            '            minifyEnabled false' \
            '            shrinkResources false' \
            '        }' \
            '    }' \
            '}' \
            'flutter { source "../.." }' \
            > fresh_project/android/app/build.gradle

          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" \
            "android.useAndroidX=true" \
            "android.enableJetifier=true" \
            > fresh_project/android/gradle.properties

          printf '%s\n' \
            'pluginManagement {' \
            '    def flutterSdkPath = {' \
            '        def properties = new Properties()' \
            '        file("local.properties").withInputStream { properties.load(it) }' \
            '        def flutterSdkPath = properties.getProperty("flutter.sdk")' \
            '        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"' \
            '        return flutterSdkPath' \
            '    }()' \
            '    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")' \
            '    repositories { google(); mavenCentral(); gradlePluginPortal() }' \
            '}' \
            'plugins {' \
            '    id "dev.flutter.flutter-plugin-loader" version "1.0.0"' \
            '    id "com.android.application" version "8.7.3" apply false' \
            '    id "org.jetbrains.kotlin.android" version "2.0.21" apply false' \
            '}' \
            'include ":app"' \
            > fresh_project/android/settings.gradle

      - name: Write voice_service.dart
        run: |
          printf '%s\n' \
            "import 'dart:convert';" \
            "import 'dart:io';" \
            "import 'package:record/record.dart';" \
            "import 'package:just_audio/just_audio.dart';" \
            "import 'package:http/http.dart' as http;" \
            "import 'package:path_provider/path_provider.dart';" \
            "" \
            "class VoiceService {" \
            "  final AudioRecorder _recorder = AudioRecorder();" \
            "  final AudioPlayer _player = AudioPlayer();" \
            "  bool _isRecording = false;" \
            "  bool _isPlaying = false;" \
            "  String? _recordingPath;" \
            "  Function(bool)? onPlayingChanged;" \
            "  Function(bool)? onRecordingChanged;" \
            "" \
            "  Future<void> init() async {" \
            "    _player.playerStateStream.listen((state) {" \
            "      _isPlaying = state.playing;" \
            "      onPlayingChanged?.call(_isPlaying);" \
            "    });" \
            "  }" \
            "" \
            "  bool get isRecording => _isRecording;" \
            "  bool get isPlaying => _isPlaying;" \
            "" \
            "  Future<bool> startRecording() async {" \
            "    if (_isRecording) return false;" \
            "    final hasPermission = await _recorder.hasPermission();" \
            "    if (!hasPermission) return false;" \
            "    final dir = await getTemporaryDirectory();" \
            "    _recordingPath = '\${dir.path}/rm_\${DateTime.now().millisecondsSinceEpoch}.m4a';" \
            "    await _recorder.start(" \
            "      const RecordConfig(encoder: AudioEncoder.aacLc, sampleRate: 16000)," \
            "      path: _recordingPath!," \
            "    );" \
            "    _isRecording = true;" \
            "    onRecordingChanged?.call(true);" \
            "    return true;" \
            "  }" \
            "" \
            "  Future<String?> stopRecording() async {" \
            "    if (!_isRecording) return null;" \
            "    final path = await _recorder.stop();" \
            "    _isRecording = false;" \
            "    onRecordingChanged?.call(false);" \
            "    return path;" \
            "  }" \
            "" \
            "  Future<String> transcribeAudio(String filePath, String apiKey) async {" \
            "    final req = http.MultipartRequest('POST', Uri.parse('https://api.openai.com/v1/audio/transcriptions'));" \
            "    req.headers['Authorization'] = 'Bearer \$apiKey';" \
            "    req.files.add(await http.MultipartFile.fromPath('file', filePath, filename: 'audio.m4a'));" \
            "    req.fields['model'] = 'whisper-1';" \
            "    final res = await http.Response.fromStream(await req.send());" \
            "    if (res.statusCode == 200) return jsonDecode(res.body)['text'] as String? ?? '';" \
            "    throw Exception('Whisper error \${res.statusCode}');" \
            "  }" \
            "" \
            "  Future<void> speak(String text, String apiKey, {String voice = 'nova'}) async {" \
            "    await _player.stop();" \
            "    final res = await http.post(" \
            "      Uri.parse('https://api.openai.com/v1/audio/speech')," \
            "      headers: {'Authorization': 'Bearer \$apiKey', 'Content-Type': 'application/json'}," \
            "      body: jsonEncode({'model': 'tts-1', 'voice': voice, 'input': text})," \
            "    );" \
            "    if (res.statusCode == 200) {" \
            "      final dir = await getTemporaryDirectory();" \
            "      final file = File('\${dir.path}/tts_\${DateTime.now().millisecondsSinceEpoch}.mp3');" \
            "      await file.writeAsBytes(res.bodyBytes);" \
            "      await _player.setFilePath(file.path);" \
            "      await _player.play();" \
            "    } else { throw Exception('TTS error \${res.statusCode}'); }" \
            "  }" \
            "" \
            "  Future<void> stopSpeaking() async => await _player.stop();" \
            "" \
            "  Future<void> dispose() async {" \
            "    await _recorder.dispose();" \
            "    await _player.dispose();" \
            "  }" \
            "}" \
            > fresh_project/lib/services/voice_service.dart

      - name: Flutter pub get
        working-directory: fresh_project
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_project
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: RuanMei-Companion-APK
          path: fresh_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
