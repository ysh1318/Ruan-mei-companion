name: Build Ruan Mei APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.ruanmei --project-name ruan_mei_companion fresh_project
          echo "✓ Fresh project created"

      - name: Extract our source code from zip
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          unzip "$ZIP" -d extracted/
          PROJECT=$(dirname $(find extracted/ -name "pubspec.yaml" | head -1))
          cp -r "$PROJECT/lib/." fresh_project/lib/
          mkdir -p fresh_project/assets/live2d/html
          find extracted/ -name "live2d_viewer.html" -exec cp {} fresh_project/assets/live2d/html/ \;
          cp "$PROJECT/pubspec.yaml" fresh_project/pubspec.yaml
          echo "✓ Code injected"

      - name: Set Android SDK 35
        working-directory: fresh_project/android/app
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdk 35/' build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdk 35/' build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 23/' build.gradle
          echo "✓ SDK versions set"
          cat build.gradle

      - name: Flutter pub get
        working-directory: fresh_project
        run: flutter pub get

      - name: Build APK
        working-directory: fresh_project
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: RuanMei-Companion-APK
          path: fresh_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
